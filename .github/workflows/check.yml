name: check

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.4.363.0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Restore the Vulkan SDK
        id: vulkan
        uses: actions/cache@v4
        with:
          path: C:/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows-x64
      - name: Install the Vulkan SDK
        if: steps.vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          curl.exe -sSfL --retry 3 --retry-delay 5 -o $installer $url
          $root = "C:\VulkanSDK\$version"
          $installerArgs = @(
            '--root', $root,
            '--accept-licenses',
            '--default-answer',
            '--confirm-command',
            'install'
          )
          $process = Start-Process -FilePath $installer -ArgumentList $installerArgs -Verb RunAs -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "the Vulkan SDK installer exited with $($process.ExitCode)"
          }
          if (-not (Test-Path (Join-Path $root 'Bin\glslc.exe'))) {
            throw "the Vulkan SDK at $root is missing Bin\glslc.exe"
          }
      - name: Use the Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path (Join-Path $sdk 'Bin\glslc.exe'))) {
            throw "the Vulkan SDK is not usable at $sdk"
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_SDK_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $sdk 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Locate the Windows shader compiler
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release

  # The Mac build is a real build, not a cargo check on a Windows machine. It
  # compiles the event tap and the Metal engine with Apple's toolchain, which is
  # the only way to know the macOS modules link. It does not run a dictation:
  # an event tap needs Accessibility and Input Monitoring, and a runner cannot
  # grant either. Behaviour on a Mac still needs a person at the keyboard.
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check the native toolchain
        run: |
          cmake --version
          xcrun --sdk macosx --show-sdk-version
          xcrun -f metal
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      # An ad-hoc signature is the most a stock runner can prove: the bundle
      # structure, Info.plist, icon, and the codesign call itself. A Developer ID
      # and notarization need repository secrets (docs/MACOS.md stage 8).
      - name: Build the app bundle
        run: MAKE_DMG=1 bash scripts/build-macos-app.sh
      - name: Verify the app bundle
        run: |
          plutil -lint dist/Draft.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/Draft.app
          test -f dist/Draft-*.dmg
