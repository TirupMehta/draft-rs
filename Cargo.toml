[workspace]
members = [
    "crates/draft-core",
    "crates/draft-engine",
    "crates/draft-audio",
    "crates/draft-hotkey",
    "crates/draft-paste",
    "crates/draft-cli",
    "apps/desktop",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/TirupMehta/draft-rs"
rust-version = "1.85"

[workspace.dependencies]
draft-core = { path = "crates/draft-core" }
draft-engine = { path = "crates/draft-engine" }
draft-audio = { path = "crates/draft-audio" }
draft-hotkey = { path = "crates/draft-hotkey" }
draft-paste = { path = "crates/draft-paste" }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
