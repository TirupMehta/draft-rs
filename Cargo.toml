[workspace]
members = ["crates/draft-core", "crates/draft-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/TirupMehta/draft-rs"
rust-version = "1.85"

[workspace.dependencies]
draft-core = { path = "crates/draft-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
