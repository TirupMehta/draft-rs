[package]
name = "draft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Draft desktop shell for Windows, macOS, and Linux."

[[bin]]
name = "draft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
color-eyre = "0.6"
draft-audio.workspace = true
draft-core.workspace = true
draft-engine.workspace = true
draft-hotkey.workspace = true
draft-paste.workspace = true
gpui = { version = "0.2.2", default-features = false, features = [
  "font-kit",
  "windows-manifest",
] }
raw-window-handle = "0.6"
tray-icon = "0.24"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# The HUD needs AppKit primitives GPUI does not expose: a window level above
# every application, click-through, and a presence on all Spaces. GPUI already
# links these frameworks through `arboard`, so this adds no native dependency.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAccessibility",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
